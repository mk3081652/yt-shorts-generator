<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="50%" stop-color="#FF0033" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF0055" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle Badge with Glow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Inner Subtle Ring -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Play Symbol (Crisp White) -->
  <path d="M25 19 L45 32 L25 45 Z" fill="#FFFFFF" />

  <!-- Energy Lightning Bolt Badge on bottom-right corner -->
  <polygon points="46,36 41,44 45,44 40,54 50,43 45,43" fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
</svg>
